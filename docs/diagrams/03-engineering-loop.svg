<text x="40" y="53" font-size="30" font-weight="700" text-anchor="start" fill="#1e1e1e">The engineering loop</text>
<text x="40" y="80" font-size="15" font-weight="400" text-anchor="start" fill="#495057">The steady state after the map is trusted. Every feature or bugfix runs the same closed loop; each stage leaves a durable artifact in ai/lab/.</text>
<text x="585" y="170" font-size="13" font-weight="400" text-anchor="middle" fill="#1e1e1e">1. SPEC</text>
<text x="585" y="187" font-size="13" font-weight="400" text-anchor="middle" fill="#1e1e1e">specification-driven</text>
<text x="585" y="203" font-size="13" font-weight="400" text-anchor="middle" fill="#1e1e1e">ai/lab/specs/SPEC_* · BUGFIX_*</text>
<text x="585" y="219" font-size="13" font-weight="400" text-anchor="middle" fill="#1e1e1e">gate: no code before the human OKs it</text>
<text x="767" y="275" font-size="13" font-weight="400" text-anchor="middle" fill="#1e1e1e">2. DECIDE</text>
<text x="767" y="292" font-size="13" font-weight="400" text-anchor="middle" fill="#1e1e1e">decision records</text>
<text x="767" y="308" font-size="13" font-weight="400" text-anchor="middle" fill="#1e1e1e">ai/lab/decisions/ADR_*</text>
<text x="767" y="324" font-size="13" font-weight="400" text-anchor="middle" fill="#1e1e1e">gate: non-obvious choices written down</text>
<text x="767" y="485" font-size="13" font-weight="400" text-anchor="middle" fill="#1e1e1e">3. IMPLEMENT</text>
<text x="767" y="502" font-size="13" font-weight="400" text-anchor="middle" fill="#1e1e1e">surgical diffs</text>
<text x="767" y="518" font-size="13" font-weight="400" text-anchor="middle" fill="#1e1e1e">/add-feature · /fix-bug · /implement-spec</text>
<text x="767" y="534" font-size="13" font-weight="400" text-anchor="middle" fill="#1e1e1e">gate: Stability — frozen/? needs approval</text>
<text x="585" y="590" font-size="13" font-weight="400" text-anchor="middle" fill="#1e1e1e">4. REVIEW</text>
<text x="585" y="607" font-size="13" font-weight="400" text-anchor="middle" fill="#1e1e1e">review-driven — fresh context</text>
<text x="585" y="623" font-size="13" font-weight="400" text-anchor="middle" fill="#1e1e1e">ai/lab/reviews/REVIEW_*</text>
<text x="585" y="639" font-size="13" font-weight="400" text-anchor="middle" fill="#1e1e1e">gate: never the implementing session</text>
<text x="403" y="485" font-size="13" font-weight="400" text-anchor="middle" fill="#1e1e1e">5. EVALUATE</text>
<text x="403" y="502" font-size="13" font-weight="400" text-anchor="middle" fill="#1e1e1e">evaluation-driven</text>
<text x="403" y="518" font-size="13" font-weight="400" text-anchor="middle" fill="#1e1e1e">ai/lab/evaluations/EVAL_*</text>
<text x="403" y="534" font-size="13" font-weight="400" text-anchor="middle" fill="#1e1e1e">what went well / poorly, audit cost</text>
<text x="403" y="275" font-size="13" font-weight="400" text-anchor="middle" fill="#1e1e1e">6. RECORD</text>
<text x="403" y="292" font-size="13" font-weight="400" text-anchor="middle" fill="#1e1e1e">memory</text>
<text x="403" y="308" font-size="13" font-weight="400" text-anchor="middle" fill="#1e1e1e">one row in ai/lab/WORKLOG.md</text>
<text x="403" y="324" font-size="13" font-weight="400" text-anchor="middle" fill="#1e1e1e">links spec ↔ review ↔ eval ↔ commits</text>
<text x="585" y="359" font-size="12" font-weight="400" text-anchor="middle" fill="#1e1e1e">ONE UNIT OF WORK</text>
<text x="585" y="374" font-size="12" font-weight="400" text-anchor="middle" fill="#1e1e1e">feature added or bug fixed</text>
<text x="585" y="389" font-size="12" font-weight="400" text-anchor="middle" fill="#1e1e1e"></text>
<text x="585" y="404" font-size="12" font-weight="400" text-anchor="middle" fill="#1e1e1e">mirrors how the kit thinks:</text>
<text x="585" y="419" font-size="12" font-weight="400" text-anchor="middle" fill="#1e1e1e">ai/guide = semantic memory</text>
<text x="585" y="434" font-size="12" font-weight="400" text-anchor="middle" fill="#1e1e1e">ai/lab = episodic memory</text>
<text x="585" y="449" font-size="12" font-weight="400" text-anchor="middle" fill="#1e1e1e">WORKLOG = the episodic index</text>
<text x="48" y="686" font-size="15" font-weight="700" text-anchor="start" fill="#495057">THREE PROPERTIES KEEP THE LOOP HONEST</text>
<text x="223" y="724" font-size="12" font-weight="400" text-anchor="middle" fill="#1e1e1e">Reviewer ≠ implementer</text>
<text x="223" y="739" font-size="12" font-weight="400" text-anchor="middle" fill="#1e1e1e">review runs in a fresh session and re-runs the suites</text>
<text x="585" y="724" font-size="12" font-weight="400" text-anchor="middle" fill="#1e1e1e">Reproduction before fix</text>
<text x="585" y="739" font-size="12" font-weight="400" text-anchor="middle" fill="#1e1e1e">a failing regression test proves the bug is understood</text>
<text x="947" y="724" font-size="12" font-weight="400" text-anchor="middle" fill="#1e1e1e">The ledger cannot rot</text>
<text x="947" y="739" font-size="12" font-weight="400" text-anchor="middle" fill="#1e1e1e">verify --strict checks every WORKLOG artifact path</text>
</svg>
