<text x="40" y="53" font-size="30" font-weight="700" text-anchor="start" fill="#1e1e1e">ai-fication-kit — System Map</text>
<text x="40" y="80" font-size="15" font-weight="400" text-anchor="start" fill="#495057">A zero-dependency Node CLI that stamps a provenance-tracked ai/ knowledge layer into any legacy repo —</text>
<text x="40" y="102" font-size="15" font-weight="400" text-anchor="start" fill="#495057">so an AI agent reads a trusted, human-verified map instead of re-crawling and guessing.</text>
<text x="48" y="156" font-size="15" font-weight="700" text-anchor="start" fill="#495057">THE KIT  (this repo)</text>
<text x="181" y="200" font-size="14" font-weight="400" text-anchor="middle" fill="#1e1e1e">install.mjs</text>
<text x="181" y="218" font-size="14" font-weight="400" text-anchor="middle" fill="#1e1e1e">CLI — dispatch only, no logic</text>
<text x="180" y="300" font-size="13" font-weight="400" text-anchor="middle" fill="#1e1e1e">DETERMINISTIC scripts  (no LLM)</text>
<text x="180" y="317" font-size="13" font-weight="400" text-anchor="middle" fill="#1e1e1e"></text>
<text x="180" y="333" font-size="13" font-weight="400" text-anchor="middle" fill="#1e1e1e">orient · indepth · maturity</text>
<text x="180" y="349" font-size="13" font-weight="400" text-anchor="middle" fill="#1e1e1e">verify · drift · status/doctor · update</text>
<text x="180" y="428" font-size="13" font-weight="400" text-anchor="middle" fill="#1e1e1e">MODEL INFERENCE  (AI agent)</text>
<text x="180" y="445" font-size="13" font-weight="400" text-anchor="middle" fill="#1e1e1e"></text>
<text x="180" y="461" font-size="13" font-weight="400" text-anchor="middle" fill="#1e1e1e">/cold-start · /create-feature-catalog</text>
<text x="180" y="477" font-size="13" font-weight="400" text-anchor="middle" fill="#1e1e1e">everything it writes = [inferred]</text>
<text x="180" y="539" font-size="13" font-weight="400" text-anchor="middle" fill="#1e1e1e">HUMAN  (the trust boundary)</text>
<text x="180" y="556" font-size="13" font-weight="400" text-anchor="middle" fill="#1e1e1e">the audit — set Stability,</text>
<text x="180" y="572" font-size="13" font-weight="400" text-anchor="middle" fill="#1e1e1e">flip [inferred] → [verified]</text>
<rect x="163" y="237" width="35" height="18" fill="#ffffff"/>
<text x="181" y="250" font-size="13" font-weight="400" text-anchor="middle" fill="#495057">runs</text>
<text x="420" y="177" font-size="16" font-weight="700" text-anchor="start" fill="#1971c2">ai/  — the shared knowledge layer</text>
<text x="580" y="222" font-size="13" font-weight="400" text-anchor="middle" fill="#1e1e1e">ai/repo-profile.json  ·  repo-indepth.json</text>
<text x="580" y="239" font-size="13" font-weight="400" text-anchor="middle" fill="#1e1e1e">deterministic machine-readable facts</text>
<text x="580" y="295" font-size="13" font-weight="400" text-anchor="middle" fill="#1e1e1e">ai/guide/</text>
<text x="580" y="312" font-size="13" font-weight="400" text-anchor="middle" fill="#1e1e1e">MODULE_MAP · ARCHITECTURE · FEATURE_MAP</text>
<text x="580" y="328" font-size="13" font-weight="400" text-anchor="middle" fill="#1e1e1e">PROJECT_OVERVIEW · CONVENTIONS</text>
<text x="580" y="383" font-size="13" font-weight="400" text-anchor="middle" fill="#1e1e1e">ai/analysis/</text>
<text x="580" y="400" font-size="13" font-weight="400" text-anchor="middle" fill="#1e1e1e">FEATURE_CATALOG · diagrams ·</text>
<text x="580" y="416" font-size="13" font-weight="400" text-anchor="middle" fill="#1e1e1e">audit reports (maturity / drift / verify)</text>
<text x="580" y="476" font-size="13" font-weight="400" text-anchor="middle" fill="#1e1e1e">ai/lab/</text>
<text x="580" y="493" font-size="13" font-weight="400" text-anchor="middle" fill="#1e1e1e">specs · decisions (ADRs) · reviews ·</text>
<text x="580" y="509" font-size="13" font-weight="400" text-anchor="middle" fill="#1e1e1e">evaluations · ROADMAP · WORKLOG</text>
<text x="420" y="559" font-size="12" font-weight="400" text-anchor="start" fill="#495057">Every ai/ claim ships [inferred]; only the human audit</text>
<text x="420" y="577" font-size="12" font-weight="400" text-anchor="start" fill="#495057">flips it to [verified]. Agents are forbidden to self-certify.</text>
<rect x="344" y="261" width="93" height="18" fill="#ffffff"/>
<text x="391" y="274" font-size="13" font-weight="400" text-anchor="middle" fill="#2f9e44">writes facts</text>
<rect x="326" y="365" width="130" height="18" fill="#ffffff"/>
<text x="391" y="378" font-size="13" font-weight="400" text-anchor="middle" fill="#6741d9">drafts [inferred]</text>
<rect x="334" y="513" width="64" height="18" fill="#ffffff"/>
<text x="366" y="526" font-size="13" font-weight="400" text-anchor="middle" fill="#f08c00">verifies</text>
<text x="838" y="226" font-size="15" font-weight="700" text-anchor="start" fill="#e03131">WHO READS THE MAP</text>
<text x="971" y="278" font-size="13" font-weight="400" text-anchor="middle" fill="#1e1e1e">Any AI coding agent</text>
<text x="971" y="295" font-size="13" font-weight="400" text-anchor="middle" fill="#1e1e1e">Claude Code · Cursor · Copilot ·</text>
<text x="971" y="311" font-size="13" font-weight="400" text-anchor="middle" fill="#1e1e1e">Codex · Antigravity</text>
<text x="971" y="327" font-size="13" font-weight="400" text-anchor="middle" fill="#1e1e1e">(reads the same maps)</text>
<text x="971" y="397" font-size="13" font-weight="400" text-anchor="middle" fill="#1e1e1e">New teammates</text>
<text x="971" y="414" font-size="13" font-weight="400" text-anchor="middle" fill="#1e1e1e">fastest onboarding doc —</text>
<text x="971" y="430" font-size="13" font-weight="400" text-anchor="middle" fill="#1e1e1e">what is safe to touch &amp; why</text>
<text x="970" y="492" font-size="13" font-weight="400" text-anchor="middle" fill="#1e1e1e">verify + drift (CI)</text>
<text x="970" y="509" font-size="13" font-weight="400" text-anchor="middle" fill="#1e1e1e">keep the map honest as code moves</text>
<rect x="735" y="293" width="108" height="18" fill="#ffffff"/>
<text x="789" y="306" font-size="13" font-weight="400" text-anchor="middle" fill="#e03131">read on demand</text>
<rect x="764" y="440" width="50" height="18" fill="#ffffff"/>
<text x="789" y="453" font-size="13" font-weight="400" text-anchor="middle" fill="#2f9e44">audits</text>
<text x="40" y="631" font-size="12" font-weight="400" text-anchor="start" fill="#868e96">green = deterministic (no LLM)    violet = agent inference ([inferred])    yellow = human ([verified])    blue = the ai/ product</text>
</svg>
